# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Primary Builder: MkDocs (with Material theme)
mkdocs:
  configuration: readthedocs/mkdocs.yml

# Secondary Builder Option: Sphinx (if configured to use conf.py)
# sphinx:
#   configuration: readthedocs/conf.py

python:
  install:
    - requirements: readthedocs/requirements.txt
